<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Authentication</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            
            <div class="brand">
                <h2>Dayflow</h2>
                <p>Every workday, perfectly aligned.</p>
            </div>

            <!-- Error Message Container (Hidden by default) -->
            <div class="error-message hidden">
                Incorrect email or password. Please try again.
            </div>

            <!-- Sign In Form -->
            <form id="signInForm" class="auth-form">
                <h3>Sign In</h3>
                
                <div class="input-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" placeholder="Name@company.com" required>
                </div>
                
                <div class="input-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="auth-btn">Sign In</button>
                
                <p class="toggle-text">
                    Don't have an account? <a href="#" id="showSignUp">Sign Up</a>
                </p>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signUpForm" class="auth-form hidden">
                <h3>Create Account</h3>
                
                <div class="input-group">
                    <label for="signup-empid">Employee ID</label>
                    <input type="text" id="signup-empid" placeholder="EMP-1042" required>
                </div>

                <div class="input-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@company.com" required>
                    <small class="hint-text">Verification link will be sent to this email.</small>
                </div>
                
                <div class="input-group">
                    <label for="signup-role">Role</label>
                    <select id="signup-role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="employee">Employee</option>
                        <option value="hr">Admin / HR Officer</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a strong password" required>
                    <small class="hint-text">Must contain at least 8 characters, a number, and a symbol.</small>
                </div>
                
                <button type="submit" class="auth-btn">Sign Up</button>
                
                <p class="toggle-text">
                    Already have an account? <a href="#" id="showSignIn">Sign In</a>
                </p>
            </form>

        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
