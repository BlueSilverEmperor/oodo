<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dayflow - Reset Password
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

        }

        .card {

            width: 420px;

            max-width: 92%;

            padding: 38px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.10);

        }

        h1 {

            text-align: center;

            color: #4f46e5;

            margin: 0;

        }

        .email {

            text-align: center;

            margin-top: 10px;

            color: #64748b;

        }

        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: 600;

            color: #334155;

        }

        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

        }

        .otp {

            text-align: center;

            font-size: 20px;

            letter-spacing: 6px;

        }

        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-weight: 600;

            cursor: pointer;

        }

        .alert {

            padding: 12px;

            margin-top: 15px;

            border-radius: 8px;

        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

    </style>

</head>


<body>


<div class="card">


    <h1>
        Dayflow
    </h1>


    <div class="email">

        Password reset for:

        <strong>
            {{ email }}
        </strong>

    </div>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="/reset-password"
    >


        <label>
            6-digit OTP
        </label>

        <input
            class="otp"
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            required
        >


        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            minlength="8"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            minlength="8"
            required
        >


        <button type="submit">

            Reset Password

        </button>


    </form>


</div>


</body>

</html>
