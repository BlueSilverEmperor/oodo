<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dayflow - Email Verification
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

        }


        .verify-card {

            width: 420px;

            max-width: 92%;

            padding: 38px;

            background: white;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.10);

        }


        h1 {

            margin: 0;

            color: #4f46e5;

            font-size: 32px;

        }


        .subtitle {

            margin-top: 10px;

            color: #64748b;

        }


        .email {

            margin-top: 8px;

            color: #334155;

            font-weight: 600;

        }


        .alert {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

        }


        .alert-success {

            background: #dcfce7;

            color: #166534;

        }


        .alert-danger {

            background: #fee2e2;

            color: #991b1b;

        }


        .otp-form {

            margin-top: 28px;

        }


        label {

            display: block;

            margin-bottom: 10px;

            color: #334155;

            font-weight: 600;

        }


        input {

            width: 100%;

            padding: 14px;

            text-align: center;

            letter-spacing: 7px;

            font-size: 22px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

        }


        input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,0.10);

        }


        .verify-button {

            width: 100%;

            margin-top: 18px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        .verify-button:hover {

            background: #4338ca;

        }


        .resend-form {

            margin-top: 20px;

        }


        .resend-button {

            border: none;

            background: transparent;

            color: #4f46e5;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

        }


        .info {

            margin-top: 18px;

            color: #64748b;

            font-size: 12px;

        }

    </style>

</head>


<body>


<div class="verify-card">


    <h1>
        Dayflow
    </h1>


    <div class="subtitle">
        Verify your email address
    </div>


    <div class="email">
        {{ email }}
    </div>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}



    <form
        class="otp-form"
        method="POST"
        action="/verify"
    >


        <label for="otp">
            Enter 6-digit OTP
        </label>


        <input
            id="otp"
            type="text"
            name="otp"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            placeholder="000000"
            autocomplete="one-time-code"
            required
        >


        <button
            class="verify-button"
            type="submit"
        >

            Verify Email

        </button>


    </form>



    <form
        class="resend-form"
        method="POST"
        action="/resend-otp"
    >

        <button
            class="resend-button"
            type="submit"
        >

            Didn't receive the OTP? Resend OTP

        </button>

    </form>


    <div class="info">

        OTP expires in 5 minutes.

        <br>

        Check your email inbox and spam folder.

    </div>


</div>


</body>

</html>
