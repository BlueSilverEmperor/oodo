<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Apply for Leave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Dayflow</h2>
            </div>
            <nav class="menu">
                <a href="index.html">Dashboard</a>
                <a href="#">My Profile</a>
                <a href="employee-attendance.html">Attendance</a>
                <a href="leave.html" class="active">Leave Requests</a>
                <a href="salary.html">Salary Details</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header" style="justify-content: flex-start; gap: 20px;">
                <a href="index.html" class="back-link" style="margin-bottom: 0;">&larr; Back to Home Dashboard</a>
            </header>

            <!-- Leave Application Form -->
            <section class="dashboard-section leave-form-section" style="margin-top: 0;">
                <h2>Apply for Leave</h2>
                <form class="custom-form">
                    <div class="form-group">
                        <label for="leave-type">Leave Type:</label>
                        <select id="leave-type" name="leave-type">
                            <option value="paid">Paid</option>
                            <option value="sick">Sick</option>
                            <option value="unpaid">Unpaid</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="start-date">Start Date:</label>
                        <input type="date" id="start-date" name="start-date">
                    </div>
                    
                    <div class="form-group">
                        <label for="end-date">End Date:</label>
                        <input type="date" id="end-date" name="end-date">
                    </div>
                    
                    <div class="form-group">
                        <label for="remarks">Remarks / Reason:</label>
                        <textarea id="remarks" name="remarks" placeholder="Provide reason..." rows="4"></textarea>
                    </div>
                    
                    <button type="submit" class="btn submit-btn">Submit Request</button>
                </form>
            </section>

        </main>
    </div>
</body>
</html>
