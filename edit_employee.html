<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Edit Employee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f8fafc;
        }

        .container {
            width: 90%;
            max-width: 760px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .employee-id {
            background: #eef2ff;
            padding: 12px;
            border-radius: 8px;
            color: #3730a3;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-weight: 600;
        }

        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        a {
            background: #e2e8f0;
            color: #334155;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Employee</h1>

        <div class="employee-id">
            Employee ID: {{ employee.employee_id }}
        </div>

        <form method="POST">

            <div class="grid">

                <div>
                    <label>First Name</label>

                    <input
                        type="text"
                        name="first_name"
                        value="{{ employee.first_name or '' }}"
                        required
                    >
                </div>

                <div>
                    <label>Last Name</label>

                    <input
                        type="text"
                        name="last_name"
                        value="{{ employee.last_name or '' }}"
                        required
                    >
                </div>

                <div class="full">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ employee.email }}"
                        required
                    >
                </div>

                <div>
                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ employee.phone or '' }}"
                    >
                </div>

                <div>
                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        value="{{ employee.department or '' }}"
                    >
                </div>

                <div>
                    <label>Job Title</label>

                    <input
                        type="text"
                        name="job_title"
                        value="{{ employee.job_title or '' }}"
                    >
                </div>

                <div>
                    <label>Salary</label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        name="salary"
                        value="{{ employee.salary_structure or 0 }}"
                    >
                </div>

                <div>
                    <label>Role</label>

                    <select name="role">

                        <option
                            value="Employee"
                            {% if employee.role == 'Employee' %}
                                selected
                            {% endif %}
                        >
                            Employee
                        </option>

                        <option
                            value="Admin"
                            {% if employee.role == 'Admin' %}
                                selected
                            {% endif %}
                        >
                            Admin / HR
                        </option>

                    </select>
                </div>

                <div class="full">
                    <label>Address</label>

                    <textarea name="address">{{ employee.address or '' }}</textarea>
                </div>

            </div>

            <div class="buttons">

                <button type="submit">
                    Update Employee
                </button>

                <a href="/admin/employees/{{ employee.user_id }}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
